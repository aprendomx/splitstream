name: CI

# En push a CUALQUIER rama, no solo a main.
#
# Con el trigger anterior —push solo en main, más pull_request— una rama de trabajo sin PR
# abierto no ejecutaba nada. Eso mordió dos veces en la fase 4: al fusionar el PR enseguida,
# los commits siguientes se quedaron sin verificar y la CI parecía verde porque `gh pr
# checks` seguía enseñando el run del PR ya cerrado.
#
# No hace falta el trigger de pull_request: los PR de este mismo repo ya quedan cubiertos
# por el push de su rama, y añadirlo solo duplicaría las corridas.
on:
  push:

# Una corrida por rama: un push encima del anterior cancela el que ya no interesa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lo que no necesita ni Docker ni red. Es la barrera rápida.
  test:
    name: vet, build y tests con -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          # La versión sale de go.mod: una sola fuente de verdad.
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # CGO_ENABLED=0 como en el Makefile: el binario de producción es estático.
      - name: build estático
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/splitstream

      # El detector de carreras necesita cgo, así que aquí NO se desactiva.
      # GOMAXPROCS=2 lo pide el spec §8: con poco paralelismo el planificador reordena de
      # otra forma y salen aquí las carreras de arranque y parada que en un runner ancho
      # se esconden.
      - name: tests con -race
        env:
          GOMAXPROCS: "2"
        run: go test ./... -race -count=1

      # third_party/go-rtmp es una copia de upstream con `replace` en go.mod (spec v1.0
      # §3.4): sus propios tests corren aparte porque son del módulo yutopp/go-rtmp, no
      # del nuestro. El test de integridad (que la copia es upstream + patches/, ni un
      # byte más) ya corre arriba con `go test ./...` del módulo principal.
      - name: la copia de go-rtmp compila y pasa sus tests
        run: cd third_party/go-rtmp && go vet ./... && go test -race -count=1 ./...

      # El motor no debe conocer ni la librería RTMP ni la base de datos (spec §6).
      # Es una propiedad de la arquitectura, y sin esto se rompe sin que nadie se entere.
      - name: internal/relay sigue aislado
        run: |
          if go list -deps ./internal/relay | grep -E 'go-rtmp|database/sql|internal/store|internal/events|internal/record'; then
            echo "::error::internal/relay importa go-rtmp, database/sql, store, events o record"
            exit 1
          fi

      # La simétrica: la capa HTTP no debe conocer la librería RTMP ni cómo se termina el
      # TLS. Habla con la ingesta a través de interfaces estrechas, no del tipo concreto,
      # y el panel.tls que expone es un dato que le pasa main.go, no algo que calcule
      # importando webtls.
      # Tampoco los proveedores concretos: la API los ve por platforms.Registry y el gestor
      # de tokens por la interfaz TokenGetter, así que ni platforms/twitch ni
      # platforms/tokens pueden aparecer en sus dependencias.
      - name: internal/httpapi no conoce go-rtmp, el TLS ni los proveedores
        run: |
          if go list -deps ./internal/httpapi | grep -E 'go-rtmp|internal/rtmpio|internal/webtls|internal/platforms/twitch|internal/platforms/tokens|internal/platforms/youtube|internal/platforms/kick'; then
            echo "::error::internal/httpapi importa go-rtmp, internal/rtmpio, internal/webtls, platforms/twitch, platforms/tokens, platforms/youtube o platforms/kick"
            exit 1
          fi

      # La grabación solo conoce el motor y el inspector de FLV: ni store, ni red, ni HTTP.
      - name: internal/record sigue aislado
        run: |
          if go list -deps ./internal/record | grep 'splitstream/internal/' | grep -vE 'internal/(relay|flv|record)$'; then
            echo "::error::internal/record importa algo más que relay y flv"
            exit 1
          fi

      # La capa de plataformas (v0.11) y el chat no tocan el motor ni el transporte RTMP, y
      # el motor no los conoce: si alguien cruza la frontera, se rompe aquí.
      - name: internal/platforms e internal/chat no conocen el motor
        run: |
          if go list -deps ./internal/platforms/... ./internal/chat | grep -E "go-rtmp|internal/relay|internal/rtmpio"; then
            echo "::error::internal/platforms o internal/chat importan el motor o RTMP"
            exit 1
          fi
      - name: internal/relay no conoce las plataformas
        run: |
          if go list -deps ./internal/relay ./internal/rtmpio | grep -E "internal/platforms|internal/chat"; then
            echo "::error::el motor importa la capa de plataformas"
            exit 1
          fi

      # disk_windows.go es el primer archivo con build tag del repo: sin esto, una rotura
      # solo en Windows se vería al etiquetar la release.
      - name: compila para Windows
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/splitstream

  # El linter va en su propio job: es rápido y no depende de nada, así que no tiene por
  # qué esperar a los tests con -race. La versión es la MISMA que fija el Makefile
  # (GOLANGCI): si se cambia una, hay que cambiar la otra o lo que pasa en local deja de
  # valer aquí.
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Como en `vuln` y en el resto de jobs: sin la caché, cada corrida del linter se
          # vuelve a bajar y a compilar los módulos desde cero.
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  # Vulnerabilidades conocidas, de las dependencias y de la propia biblioteca estándar.
  # govulncheck solo reporta lo ALCANZABLE desde este código: un CVE en una función que
  # nadie llama no aparece. Por eso este job puede ser bloqueante sin volverse ruido.
  #
  # La versión es la MISMA que fija el Makefile (GOVULN): si se cambia una, hay que
  # cambiar la otra, como con el linter.
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # `go run` con la versión pegada al módulo: no toca go.mod ni go.sum.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # El panel se compila aparte del binario. Sin este job, un fallo del frontend no se
  # notaría hasta que alguien ejecutara `make build` a mano: el job de Go compila igual,
  # porque go:embed se conforma con el .gitkeep de un clon limpio.
  web:
    name: compilar el panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: instalar dependencias
        run: cd web && npm ci

      - name: paridad de idiomas
        run: cd web && node scripts/i18n-check.mjs

      - name: compilar
        run: cd web && npm run build

      - name: el dist tiene lo que el binario embebe
        run: |
          test -f web/dist/spa/index.html || { echo "::error::falta index.html"; exit 1; }
          test -f web/dist/spa/.gitkeep || { echo "::error::el build se llevó el .gitkeep"; exit 1; }
          ls -la web/dist/spa/assets | head

  # La imagen se construye igual que en producción y se ejecuta. Construirla no basta: el
  # fallo que encontramos al escribirla —la base sin permisos porque /data pertenecía a
  # root y el contenedor corre como 65532— solo aparece al arrancarla.
  docker:
    name: imagen de Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: construir
        run: docker build -f deploy/Dockerfile -t splitstream:ci --build-arg VERSION=ci .

      - name: arranca, abre su base y sirve el panel
        run: |
          CLAVE=$(docker run --rm splitstream:ci -genkey)
          docker run -d --name ss -p 18100:8080 \
            -e SPLITSTREAM_MASTER_KEY="$CLAVE" -v ss-datos:/data splitstream:ci
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:18100/ && break
            sleep 1
          done
          docker logs ss

          curl -sf -o /dev/null http://127.0.0.1:18100/ \
            || { echo "::error::la imagen no sirve el panel"; docker logs ss; exit 1; }
          curl -sf http://127.0.0.1:18100/api/setup | grep -q '"necesario":true' \
            || { echo "::error::la API no responde en la imagen"; exit 1; }
          # Si /data no fuera escribible, el arranque habría muerto con
          # "unable to open database file (14)" antes de llegar aquí.
          docker logs ss 2>&1 | grep -q "unable to open database" \
            && { echo "::error::el contenedor no puede escribir su base"; exit 1; }
          echo "la imagen arranca, abre su base y sirve el panel"

      - name: los certificados raíz viajan dentro
        # Sin ellos, cualquier destino rtmps:// falla con "certificate signed by unknown
        # authority", y Facebook solo acepta RTMPS. La imagen es scratch: no hay shell para
        # comprobarlo desde dentro, así que se mira el sistema de archivos de la imagen.
        run: |
          docker create --name tmp splitstream:ci
          docker export tmp | tar -t | grep -q "etc/ssl/certs/ca-certificates.crt" \
            || { echo "::error::la imagen no lleva certificados raíz"; exit 1; }
          docker rm tmp
          echo "los certificados raíz están en la imagen"

      - name: la unidad de systemd es válida
        run: |
          # systemd-analyze comprueba que el ExecStart exista, y aquí no hay binario
          # instalado. Se pone un marcador: lo que se valida es la sintaxis de la unidad y
          # sus directivas de endurecimiento, no que el programa esté puesto.
          sudo install -m 755 /bin/true /usr/local/bin/splitstream
          systemd-analyze verify deploy/splitstream.service

  # Los instaladores son scripts: sin esto, un error de sintaxis en install.sh solo se
  # vería cuando alguien lo ejecutara con `curl | sh` en su servidor.
  instaladores:
    name: instaladores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: shellcheck
        run: shellcheck deploy/*.sh deploy/homebrew/*.sh deploy/winget/*.sh
      - name: render.sh de Homebrew y winget
        run: sh deploy/render_test.sh
      - name: install.sh en ubuntu y alpine contra una release local
        run: sh deploy/install_test.sh
      # Del humo nocturno, aquí solo se puede comprobar lo que no necesita plataformas ni
      # secretos: que el script es válido y que se niega a arrancar sin la clave. Corre en
      # cada push a propósito: una rotura del humo no debe aparecer de madrugada.
      - name: nightly-smoke.sh
        run: sh deploy/nightly_smoke_test.sh
      # Lo mismo con la prueba de migración: aquí no hay release que descargar, así que se
      # corre en modo offline —el «binario anterior» es una copia del nuevo—. Eso no prueba
      # ninguna migración, pero sí que el script sigue funcionando; la migración de verdad,
      # contra la última release publicada, la corre la nocturna.
      - name: migrate-test.sh
        run: sh deploy/migrate_test_test.sh

  # Punta a punta contra dos mediamtx reales, con ffmpeg publicando de verdad.
  integration:
    name: integración contra mediamtx
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: instalar ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: levantar los sinks
        run: make sinks-up

      # Los tests se SALTAN si no hay sink escuchando, así que sin esta espera la CI
      # podría ponerse verde sin haber probado nada. El paso siguiente lo comprueba
      # otra vez sobre la salida, por si el sink se cayera entre medias.
      - name: esperar a que los sinks acepten conexiones
        run: |
          for port in 19351 19352; do
            for i in $(seq 1 30); do
              if timeout 1 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/$port" 2>/dev/null; then
                echo "sink en :$port listo tras ${i}s"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "::error::el sink de :$port no aceptó conexiones en 30 s"
                docker compose -f deploy/test-compose.yml logs
                exit 1
              fi
              sleep 1
            done
          done

      - name: tests de integración
        run: |
          set -o pipefail
          go test -tags integration ./test/integration/ -v -count=1 -timeout 15m 2>&1 | tee integration.log

      # Un test saltado no prueba nada, pero deja la corrida en verde. Aquí se convierte
      # en fallo, y además se exige que los tres hayan pasado de verdad.
      - name: ningún test se saltó
        run: |
          if grep -q -- '--- SKIP' integration.log; then
            echo "::error::algún test de integración se saltó; no hubo sink"
            grep -- '--- SKIP' integration.log
            exit 1
          fi
          passed=$(grep -c -- '--- PASS' integration.log || true)
          if [ "$passed" -lt 4 ]; then
            echo "::error::se esperaban 4 tests de integración, pasaron $passed"
            exit 1
          fi
          echo "$passed tests de integración pasaron"

      - name: logs de los sinks si algo falló
        if: failure()
        run: docker compose -f deploy/test-compose.yml logs

      - name: apagar los sinks
        if: always()
        run: make sinks-down
