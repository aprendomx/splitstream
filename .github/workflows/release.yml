name: Release

# Al empujar una etiqueta v*, se compila para cada plataforma y se adjunta a la release.
on:
  push:
    tags: ['v*']

# Mínimo en el workflow; cada job pide lo suyo. Sin esto, un paso comprometido de
# cualquier job podría empujar al repo con el token del runner.
permissions:
  contents: read

jobs:
  binarios:
    name: ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: darwin,  arch: arm64, nombre: macos-apple-silicon }
          - { os: darwin,  arch: amd64, nombre: macos-intel }
          - { os: linux,   arch: amd64, nombre: linux-x86_64 }
          - { os: linux,   arch: arm64, nombre: linux-arm64 }
          - { os: windows, arch: amd64, nombre: windows-x86_64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # El panel va DENTRO del binario vía go:embed, así que hay que compilarlo antes.
      - name: compilar el panel
        run: cd web && npm ci && npm run build

      # La compilación cruzada solo es posible porque no hay cgo: modernc.org/sqlite es
      # SQLite reescrito en Go puro. Con el driver de C haría falta un toolchain por
      # plataforma y esta matriz no existiría.
      - name: compilar el binario
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          SALIDA="splitstream"
          [ "${{ matrix.os }}" = "windows" ] && SALIDA="splitstream.exe"
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$SALIDA" ./cmd/splitstream
          ls -la "$SALIDA"

      - name: comprobar que el panel viaja dentro
        # Un binario sin el panel arranca igual y sirve solo la API: el fallo no se vería
        # hasta que alguien abriera la página y encontrara un 404.
        run: |
          SALIDA="splitstream"
          [ "${{ matrix.os }}" = "windows" ] && SALIDA="splitstream.exe"
          if ! grep -qa 'id="app"' "$SALIDA"; then
            echo "::error::el binario no lleva el panel embebido"
            exit 1
          fi
          echo "el panel está dentro del binario"

      - name: empaquetar
        run: |
          NOMBRE="splitstream-${GITHUB_REF_NAME}-${{ matrix.nombre }}"
          mkdir -p "$NOMBRE"
          cp README.md LICENSE "$NOMBRE"/
          cp docs/manual-de-usuario.md "$NOMBRE"/ 2>/dev/null || true
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp splitstream.exe "$NOMBRE"/
            zip -r "$NOMBRE.zip" "$NOMBRE"
          else
            # La unidad de systemd viaja dentro del tar.gz: install.sh la usa si la persona
            # decide instalar el servicio, sin tener que descargarla aparte del repo.
            cp splitstream deploy/splitstream.service "$NOMBRE"/
            tar czf "$NOMBRE.tar.gz" "$NOMBRE"
          fi
          ls -la splitstream-*

      - uses: actions/upload-artifact@v4
        with:
          name: splitstream-${{ matrix.nombre }}
          path: |
            splitstream-*.tar.gz
            splitstream-*.zip

  publicar:
    name: publicar la release
    needs: binarios
    runs-on: ubuntu-latest
    # Crea la release y sube los artefactos.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true

      # Un checksum por archivo: sirve para verificar una descarga y para detectar que dos
      # plataformas produjeron el mismo binario por error de la matriz.
      - name: sumas de verificación
        run: |
          cd artefactos
          sha256sum splitstream-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: adjuntar a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" artefactos/* --clobber \
            || gh release create "${GITHUB_REF_NAME}" artefactos/* \
                 --title "${GITHUB_REF_NAME}" --generate-notes

  # D7: la imagen se publica en GHCR con GITHUB_TOKEN; no hace falta ningún secreto. Va en
  # paralelo con los binarios: construye desde el Dockerfile, no desde los artefactos.
  ghcr:
    name: imagen en GHCR
    # needs: :latest no se puede deshacer. Que no se publique la imagen de una release
    # cuyos binarios ni siquiera compilaron.
    needs: binarios
    # Una pre-release (vX.Y.Z-rc1) no debe quedarse con :latest. El `!` del principio
    # obliga a la forma ${{ }}: sin ella, YAML no acepta que el escalar empiece por `!`.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/aprendomx/splitstream:${{ github.ref_name }}
            ghcr.io/aprendomx/splitstream:latest

  # La fórmula se instala de verdad en un Mac antes de empujarla al tap. Sin TAP_TOKEN
  # se valida y se adjunta a la release, y el tap se actualiza a mano.
  tap:
    name: fórmula de Homebrew
    needs: publicar
    # Una pre-release no va al tap: brew install splitstream daría un candidato.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-latest
    # Adjunta la fórmula a la release.
    permissions:
      contents: write
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: renderizar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${GITHUB_REF_NAME}" --pattern SHA256SUMS.txt
          deploy/homebrew/render.sh "${GITHUB_REF_NAME}" SHA256SUMS.txt > splitstream.rb
          cat splitstream.rb
      - name: instalar la fórmula de verdad
        run: |
          brew install --formula ./splitstream.rb
          splitstream -version | grep -F "${GITHUB_REF_NAME}"
      - name: adjuntar a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" splitstream.rb --clobber
      - name: empujar al tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone --quiet "https://x-access-token:${TAP_TOKEN}@github.com/aprendomx/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp splitstream.rb tap/Formula/splitstream.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/splitstream.rb
          git commit --quiet -m "splitstream ${GITHUB_REF_NAME}" || echo "la fórmula no cambió"
          git push --quiet

  # Los manifiestos se validan si el runner trae winget, se adjuntan a la release y, con
  # WINGET_TOKEN, se envían a microsoft/winget-pkgs (la primera vez la revisa una persona).
  winget:
    name: manifiestos de winget
    needs: publicar
    # Una pre-release no se envía a winget-pkgs: la revisa una persona y no se retira.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    # Adjunta los manifiestos a la release.
    permissions:
      contents: write
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: renderizar
        id: render
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS.txt
          DIR="manifests/a/aprendomx/Splitstream/${GITHUB_REF_NAME#v}"
          deploy/winget/render.sh "$GITHUB_REF_NAME" SHA256SUMS.txt "$DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          7z a winget-manifests.zip manifests > /dev/null
      - name: validar
        shell: pwsh
        run: |
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget validate --manifest "${{ steps.render.outputs.dir }}"
          } else {
            Write-Warning "winget no está en este runner; se omite la validación"
          }
      - name: adjuntar a la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" winget-manifests.zip --clobber
      - name: enviar a winget-pkgs
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN "${{ steps.render.outputs.dir }}"
