# Dependabot abre los PR de actualización; quien decide sigue siendo la CI, que es la que
# tiene que ponerse verde antes de fusionar ninguno.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Las indirectas van todas en un PR: por separado son una docena de PR al mes que
    # nadie lee, y leerlos es justo lo único que los hace útiles.
    groups:
      indirectas:
        dependency-type: indirect

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # Los mayores de Quasar y Vue NO se automatizan: son migraciones del panel entero, con
    # su repaso a mano, no una actualización que se fusione porque la CI esté verde.
    ignore:
      - dependency-name: "quasar"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vue"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
