# Despliegue de Splitstream con Docker.
#
#   1. cp deploy/env.example deploy/.env
#   2. docker compose -f deploy/docker-compose.yml run --rm splitstream -genkey
#      y pega el resultado en deploy/.env
#   3. docker compose -f deploy/docker-compose.yml up -d
#   4. docker compose -f deploy/docker-compose.yml logs | grep -A2 "te pedirá este código"
#
# `docker compose pull` trae la última imagen publicada antes de recrear el contenedor.
#
# El paso 4 hace falta porque desde Docker el panel se ve como si viniera de otra máquina
# —la petición llega por la red puente, no por loopback— así que el asistente pide el
# código del primer arranque. Es lo conservador: no hay forma de distinguir Docker en tu
# portátil de Docker en un servidor expuesto.

services:
  splitstream:
    # La imagen publicada; no hace falta clonar el repo. Para construirla tú, comenta
    # `image` y descomenta `build`.
    image: ghcr.io/aprendomx/splitstream:latest
    #build:
    #  context: ..
    #  dockerfile: deploy/Dockerfile
    container_name: splitstream
    restart: unless-stopped

    env_file: .env

    ports:
      # RTMP: es donde publica OBS.
      - "1935:1935"
      # Panel. Se ata a 127.0.0.1 a propósito: si quieres alcanzarlo desde fuera, ponlo
      # detrás de un proxy con HTTPS en vez de abrir este puerto al mundo. La contraseña
      # viajaría en claro.
      - "127.0.0.1:8080:8080"
      # TLS integrado: descomenta estos dos, pon SPLITSTREAM_TLS_DOMAIN en .env y quita
      # la línea de 127.0.0.1:8080. Dentro del contenedor no hace falta root para 80 y
      # 443: Docker permite puertos bajos a cualquier usuario desde la 20.10.
      #- "80:80"
      #- "443:443"

    volumes:
      # La base de datos: las claves de tus canales y la contraseña del panel. Sin este
      # volumen se pierde todo al recrear el contenedor.
      - splitstream-datos:/data

    # El contenedor no necesita escribir en ningún otro sitio.
    read_only: true
    security_opt:
      - no-new-privileges:true

    # El healthcheck lo trae la imagen: `splitstream -healthcheck` consulta /healthz.
    # `docker compose ps` enseña healthy/unhealthy.

volumes:
  splitstream-datos:
